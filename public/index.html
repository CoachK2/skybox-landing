:root {
  --ink: #14171c;
  --muted: #6a7585;
  --line: #e4e6e9;
  --violet: #d4a843;
  --violet-deep: #b8912f;
  --green: #15a36e;
  --gold: #d4a843;
  --gold-deep: #b8912f;
  --gold-text: #8a6a15;
  --slate: #464f5c;
  --slate-deep: #2b313a;
  --near-black: #14171c;
  --font-geist: Arial,sans-serif;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: #fff;
  color: var(--ink);
  font-family: var(--font-geist),Arial,sans-serif;
  -webkit-font-smoothing: antialiased;
}
a {
  color: inherit;
  text-decoration: none;
}
.shell {
  width: min(1180px,calc(100% - 48px));
  margin: auto;
}
.announcement {
  background: #1b1d21;
  color: #e5e7ea;
  font-size: 13px;
}
.announcement-inner {
  height: 42px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
}
.announcement p {
  margin: 0;
}
.announcement strong {
  color: #fff;
  font-weight: 650;
}
.announcement a {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #d9dce0;
  font-weight: 650;
  margin-left: 8px;
}
.announcement-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #58d6a5;
  box-shadow: 0 0 0 4px rgba(88,214,165,.13);
}
.site-header {
  height: 98px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
}
.brand {
  display: inline-flex;
  align-items: center;
}
.brand img {
  display: block;
  width: 158px;
  height: 76px;
  object-fit: contain;
  object-position: left center;
}
.site-header nav {
  display: flex;
  gap: 32px;
  margin-left: 60px;
}
.site-header nav a,.text-link {
  color: #555e6a;
  font-size: 14px;
  font-weight: 550;
}
.site-header nav a:hover,.text-link:hover {
  color: var(--violet);
}
.header-actions {
  display: flex;
  gap: 20px;
  align-items: center;
}
.button {
  min-height: 46px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 0 18px;
  border: 1px solid var(--violet);
  border-radius: 8px;
  background: var(--violet);
  color: #fff;
  font-size: 14px;
  font-weight: 650;
  box-shadow: 0 4px 10px rgba(194,152,45,.18);
  transition: .18s ease;
}
.button:hover {
  transform: translateY(-1px);
  background: var(--violet-deep);
  box-shadow: 0 8px 18px rgba(194,152,45,.24);
}
.button-small {
  min-height: 37px;
  padding: 0 13px;
  font-size: 13px;
}
.button-secondary {
  background: #fff;
  color: var(--ink);
  border-color: #e0e3e7;
  box-shadow: none;
}
.button-secondary:hover {
  background: #f9f9fa;
  color: var(--ink);
  box-shadow: none;
}
.menu-button {
  display: none;
  border: 0;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.hero {
  min-height: 645px;
  padding: 86px 0 84px;
  display: grid;
  grid-template-columns: .92fr 1.08fr;
  align-items: center;
  gap: 58px;
}
.hero-copy {
  padding-bottom: 24px;
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 17px;
  color: #6d7887;
  text-transform: uppercase;
  letter-spacing: .11em;
  font-size: 11px;
  font-weight: 750;
}
.pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--violet);
  box-shadow: 0 0 0 4px #f6f7f8;
}
.hero h1 {
  max-width: 560px;
  margin: 0;
  font-size: clamp(43px,5vw,68px);
  line-height: .98;
  letter-spacing: -.062em;
  font-weight: 670;
}
.hero-lede {
  max-width: 510px;
  margin: 25px 0 30px;
  color: #656f7d;
  font-size: 17px;
  line-height: 1.6;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.hero-proof {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-top: 33px;
}
.hero-proof p {
  color: #6a7585;
  font-size: 13px;
  margin: 0;
}
.hero-proof strong {
  color: var(--ink);
}
.avatar-stack {
  display: flex;
}
.avatar-stack i {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  margin-right: -7px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: #e8eaec;
  color: #5b6572;
  font-size: 7px;
  font-style: normal;
  font-weight: 800;
}
.avatar-stack i:nth-child(2) {
  background: #d9f3eb;
  color: #1e7159;
}
.avatar-stack i:nth-child(3) {
  background: #ffdfbd;
  color: #8a4b1c;
}
.product-stage {
  position: relative;
  min-height: 475px;
  display: grid;
  place-items: center;
}
.stage-glow {
  position: absolute;
  inset: 12px 1px 18px;
  border-radius: 24px;
  background: radial-gradient(circle at 83% 16%,#b7bdc5 0,rgba(183,189,197,.4) 24%,transparent 50%),linear-gradient(136deg,#31363c,#1a1c20);
  transform: rotate(-1.7deg);
  box-shadow: 0 28px 62px rgba(41,45,51,.2);
}
.dashboard-card {
  position: relative;
  width: 96%;
  overflow: hidden;
  border: 1px solid rgba(227,230,233,.73);
  border-radius: 12px;
  background: #f9f9fa;
  box-shadow: 0 18px 38px rgba(12,13,15,.29);
}
.dashboard-topbar {
  height: 44px;
  padding: 0 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fff;
  border-bottom: 1px solid #e9ebee;
  color: #545d69;
  font-size: 10px;
  font-weight: 700;
}
.dashboard-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: .06em;
}
.mini-mark {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 6px;
  background: var(--violet);
  color: #fff;
  font-size: 11px;
  font-weight: 850;
}
.dashboard-divider {
  height: 14px;
  width: 1px;
  background: #e3e5e8;
}
.live-status {
  display: flex;
  align-items: center;
  gap: 5px;
  color: #507261;
  font-size: 9px;
}
.live-status span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #24ae75;
}
.dashboard-body {
  display: grid;
  grid-template-columns: 120px 1fr;
  min-height: 357px;
}
.dashboard-nav {
  padding: 18px 10px;
  border-right: 1px solid #e9ebee;
  background: #fff;
  display: grid;
  align-content: start;
  gap: 4px;
}
.dashboard-nav span {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px;
  border-radius: 6px;
  color: #7d8796;
  font-size: 9px;
}
.dashboard-nav .nav-current {
  background: #f5f6f7;
  color: #87919e;
  font-weight: 700;
}
.dashboard-main {
  padding: 21px;
}
.dashboard-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.dashboard-heading p {
  color: #8d97a4;
  margin: 0 0 4px;
  font-size: 9px;
}
.dashboard-heading h2 {
  margin: 0;
  letter-spacing: -.04em;
  font-size: 19px;
}
.day-pill {
  padding: 5px 7px;
  border: 1px solid #e5e8eb;
  border-radius: 20px;
  color: #6e7989;
  font-size: 8px;
}
.metric-row {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 9px;
  margin: 16px 0;
}
.metric-row article {
  min-height: 80px;
  padding: 11px;
  border: 1px solid #e7e9ec;
  border-radius: 8px;
  background: #fff;
}
.metric-row span {
  display: block;
  color: #788393;
  font-size: 8px;
}
.metric-row strong {
  display: block;
  margin: 5px 0;
  letter-spacing: -.04em;
  font-size: 22px;
}
.metric-row em {
  display: flex;
  gap: 3px;
  align-items: center;
  color: #46906f;
  font-style: normal;
  font-size: 7px;
}
.metric-row em.attention {
  color: #967215;
}
.tasks-card {
  padding: 13px;
  border: 1px solid #e5e8eb;
  border-radius: 8px;
  background: #fff;
}
.tasks-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 10px;
}
.tasks-title h3 {
  margin: 0;
  font-size: 10px;
}
.tasks-title a {
  display: flex;
  gap: 4px;
  align-items: center;
  color: var(--violet);
  font-size: 8px;
  font-weight: 700;
}
.task-row {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 9px 0;
  border-top: 1px solid #f0f1f3;
}
.task-icon {
  display: grid;
  place-items: center;
  width: 21px;
  height: 21px;
  border-radius: 50%;
}
.task-icon.violet {
  color: #969fab;
  background: #f6f7f8;
}
.task-icon.amber {
  color: #9c751b;
  background: #fff7d9;
}
.task-icon.green {
  color: #299266;
  background: #e8f8f0;
}
.task-row strong {
  display: block;
  font-size: 9px;
}
.task-row small {
  display: block;
  margin-top: 2px;
  color: #8b95a2;
  font-size: 7px;
}
.task-state {
  padding: 4px 6px;
  border-radius: 4px;
  font-size: 7px;
  font-weight: 700;
}
.task-state.violet {
  color: #858f9d;
  background: #f5f6f7;
}
.task-state.amber {
  color: #916b16;
  background: #fff6d9;
}
.task-state.green {
  color: #227d58;
  background: #e6f7ef;
}
.floating-note {
  position: absolute;
  right: -3px;
  bottom: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 11px 14px;
  border: 1px solid #e6e8eb;
  border-radius: 8px;
  background: #fff;
  color: #3d444d;
  font-size: 10px;
  font-weight: 650;
  box-shadow: 0 10px 20px rgba(25,27,31,.14);
}
.floating-note svg {
  color: #2aae77;
}
.floating-note span {
  margin-left: 2px;
  color: #8d96a3;
  font-size: 8px;
  font-weight: 500;
}
.logo-row {
  padding: 25px 0;
  display: flex;
  align-items: center;
  gap: 50px;
  border-top: 1px solid #eff0f2;
  border-bottom: 1px solid #eff0f2;
}
.logo-row p {
  flex: none;
  color: #8d96a3;
  font-size: 11px;
}
.logo-row div {
  display: flex;
  flex: 1;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px 18px;
  color: #636d7c;
  font-size: 13px;
  font-weight: 680;
}
.dark-band {
  padding: 107px 0 112px;
  background: #21252a;
  color: #fff;
}
.split-intro {
  display: grid;
  grid-template-columns: 1fr .74fr;
  gap: 80px;
  align-items: end;
}
.eyebrow-light {
  color: #cfd3d9;
}
.split-intro h2,.section-heading h2,.integration-copy h2,.quote-panel h2 {
  margin: 0;
  letter-spacing: -.055em;
  font-size: clamp(36px,4vw,53px);
  line-height: 1.04;
  font-weight: 650;
}
.split-intro>p {
  max-width: 405px;
  margin: 0 0 4px;
  color: #d5d8dd;
  font-size: 16px;
  line-height: 1.63;
}
.operation-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 14px;
  margin-top: 61px;
}
.operation-card {
  min-height: 267px;
  padding: 19px;
  position: relative;
  overflow: hidden;
  border: 1px solid #ae8829;
  border-radius: 11px;
  background: #2d3239;
}
.operation-number {
  color: #b4bac3;
  font-size: 11px;
  font-weight: 750;
}
.operation-icon {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  margin: 38px 0 17px;
  border-radius: 9px;
  background: #ae8829;
  color: #d8dbe0;
}
.operation-card h3 {
  margin: 0 0 9px;
  font-size: 16px;
  letter-spacing: -.025em;
}
.operation-card p {
  margin: 0;
  color: #cfd3d8;
  font-size: 13px;
  line-height: 1.55;
}
.operation-line {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg,#c2982d,#b1b8c1);
  opacity: .8;
}
.testimonials {
  padding: 105px 0 110px;
  background: #fff;
}
.testimonial-heading h2 {
  margin: 0;
  letter-spacing: -.055em;
  font-size: clamp(36px,4vw,53px);
  line-height: 1.04;
  font-weight: 650;
}
.testimonial-heading .eyebrow {
  margin-bottom: 17px;
}
.testimonial-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 16px;
  margin-top: 51px;
}
.testimonial-grid figure {
  min-height: 284px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  margin: 0;
  padding: 28px;
  border: 1px solid #e4e6e9;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 10px 25px rgba(33,37,42,.045);
}
.testimonial-grid figure:nth-child(2) {
  background: #f9fafb;
  border-color: #dddfe3;
}
.testimonial-grid blockquote {
  margin: 0;
  color: #343941;
  font-size: 20px;
  line-height: 1.38;
  letter-spacing: -.028em;
}
.testimonial-grid figcaption {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-top: 27px;
  padding-top: 18px;
  border-top: 1px solid #eaecee;
}
.testimonial-grid figcaption>span {
  display: grid;
  place-items: center;
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #eef0f2;
  color: #c2982d;
  font-size: 10px;
  font-weight: 800;
}
.testimonial-grid figcaption strong,.testimonial-grid figcaption small {
  display: block;
}
.testimonial-grid figcaption strong {
  color: #ae8829;
  font-size: 11px;
}
.testimonial-grid figcaption small {
  margin-top: 3px;
  color: #8892a0;
  font-size: 10px;
}
.outcomes {
  padding: 121px 0;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 40px;
}
.section-heading p {
  max-width: 380px;
  margin: 0 0 5px;
  color: #6a7585;
  font-size: 16px;
  line-height: 1.6;
}
.outcome-layout {
  display: grid;
  grid-template-columns: 1fr .94fr;
  gap: 80px;
  margin-top: 59px;
}
.outcome-stats {
  border-top: 1px solid var(--line);
}
.outcome-stats article {
  display: grid;
  grid-template-columns: 152px 1fr;
  gap: 27px;
  align-items: center;
  padding: 24px 0;
  border-bottom: 1px solid var(--line);
}
.outcome-stats strong {
  letter-spacing: -.06em;
  font-size: 46px;
  line-height: 1;
}
.outcome-stats strong span {
  color: var(--violet);
  font-size: 28px;
}
.outcome-stats p {
  max-width: 175px;
  margin: 0;
  color: #697483;
  font-size: 14px;
  line-height: 1.4;
}
.outcome-message {
  align-self: center;
  padding: 30px;
  border: 1px solid #e4e6e9;
  border-radius: 13px;
  background: linear-gradient(145deg,#fafafb,#fff);
  box-shadow: 0 16px 30px rgba(43,48,54,.06);
}
.message-top {
  display: flex;
  justify-content: space-between;
  color: #7d8897;
  font-size: 11px;
}
.message-top>span {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  color: #4a515c;
}
.message-dot {
  display: block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--violet);
}
.outcome-message h3 {
  margin: 35px 0 13px;
  letter-spacing: -.035em;
  font-size: 27px;
}
.outcome-message>p {
  margin: 0;
  color: #6d7887;
  font-size: 14px;
  line-height: 1.65;
}
.message-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid #e8eaed;
  color: #278360;
  font-size: 11px;
  font-weight: 700;
}
.message-actions span,.message-actions a {
  display: flex;
  align-items: center;
  gap: 5px;
}
.message-actions a {
  color: var(--violet);
}
.integrations-section {
  padding: 104px 0;
  background: #f9f9fa;
}
.integrations-layout {
  display: grid;
  grid-template-columns: .86fr 1.14fr;
  align-items: center;
  gap: 70px;
}
.integration-copy p {
  max-width: 415px;
  margin: 22px 0 26px;
  color: #6a7584;
  font-size: 16px;
  line-height: 1.65;
}
.inline-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--violet);
  font-size: 14px;
  font-weight: 700;
}
.integration-map {
  position: relative;
  min-height: 410px;
}
.orbit-motion {
  position: absolute;
  z-index: 0;
  top: 46px;
  left: calc(50% - 160px);
  width: 320px;
  height: 320px;
  border: 1px dashed rgba(194,152,45,.22);
  border-radius: 50%;
  animation: orbit-counterclockwise 18s linear infinite;
}
.orbit-motion:after {
  content: "";
  position: absolute;
  top: -3px;
  left: calc(50% - 3px);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #c2982d;
  box-shadow: 0 0 0 5px rgba(194,152,45,.1);
}
.map-hub {
  position: absolute;
  z-index: 2;
  top: 139px;
  left: calc(50% - 66px);
  display: grid;
  justify-items: center;
  align-content: center;
  width: 132px;
  height: 132px;
  border: 8px solid #f1f2f4;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 9px 24px rgba(56,61,69,.1);
}
.map-hub-logo {
  display: block;
  width: 89px;
  height: 50px;
  object-fit: contain;
}
.map-hub small {
  margin-top: 4px;
  color: #818b9a;
  font-size: 8px;
}
.map-node {
  position: absolute;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 14px;
  border: 1px solid #e4e6e9;
  border-radius: 8px;
  background: #fff;
  color: #5a6471;
  font-size: 11px;
  font-weight: 700;
  box-shadow: 0 5px 13px rgba(53,58,65,.05);
}
.map-node svg {
  color: var(--violet);
}
.node-one {
  top: 0;
  left: calc(50% - 66px);
}
.node-two {
  top: 72px;
  right: 0;
}
.node-three {
  bottom: 72px;
  left: 0;
}
.node-four {
  bottom: 0;
  left: calc(50% - 58px);
}
.node-five {
  top: 72px;
  left: 0;
}
.node-six {
  right: 0;
  bottom: 72px;
}
.map-line {
  position: absolute;
  z-index: 1;
  height: 1px;
  background: linear-gradient(90deg,rgba(207,211,217,.25),#b1b7c0 50%,rgba(207,211,217,.25));
  background-size: 200% 100%;
  transform-origin: left center;
  animation: line-flow 4s linear infinite;
}
.line-one {
  width: 139px;
  top: 205px;
  left: 50%;
  transform: rotate(-90deg);
}
.line-two {
  width: 220px;
  top: 205px;
  left: 50%;
  transform: rotate(-27deg);
}
.line-three {
  width: 220px;
  top: 205px;
  left: 50%;
  transform: rotate(153deg);
}
.line-four {
  width: 139px;
  top: 205px;
  left: 50%;
  transform: rotate(90deg);
}
.line-five {
  width: 220px;
  top: 205px;
  left: 50%;
  transform: rotate(-153deg);
}
.line-six {
  width: 220px;
  top: 205px;
  left: 50%;
  transform: rotate(27deg);
}
@keyframes orbit-counterclockwise {
  to {
    transform: rotate(-360deg);
  }
}
@keyframes line-flow {
  to {
    background-position: -200% 0;
  }
}
.quote-section {
  padding: 74px 0;
  background: #fff;
}
.quote-panel {
  padding: 47px 52px;
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 65px;
  align-items: center;
  overflow: hidden;
  border-radius: 13px;
  background: radial-gradient(circle at 91% 5%,#d4ad49 0,rgba(212,173,73,.3) 19%,transparent 40%),#21252a;
  color: #fff;
}
.quote-icon {
  display: grid;
  place-items: center;
  width: 41px;
  height: 41px;
  margin-bottom: 21px;
  border-radius: 9px;
  background: #ae8829;
  color: #dee0e4;
}
.quote-panel h2 {
  max-width: 550px;
  font-size: 34px;
}
.quote-action p {
  max-width: 340px;
  margin: 0 0 21px;
  color: #d3d7dc;
  font-size: 14px;
  line-height: 1.6;
}
.button-light {
  border-color: #fff;
  background: #fff;
  color: #ae8829;
  box-shadow: none;
}
.button-light:hover {
  background: #ecedef;
  color: #ae8829;
  box-shadow: none;
}
.footer {
  display: grid;
  grid-template-columns: 1fr 1.25fr auto;
  gap: 28px;
  align-items: center;
  padding: 29px 0;
  border-top: 1px solid #e9ebee;
  color: #717c8c;
  font-size: 12px;
}
.footer-brand img {
  width: 88px;
  height: 43px;
}
.footer p {
  margin: 0;
}
.footer div {
  display: flex;
  gap: 17px;
  justify-content: flex-end;
}
.footer a:hover {
  color: var(--violet);
}
.footer small {
  grid-column: 1/-1;
  color: #9da5b1;
  font-size: 10px;
}
.login-page {
  min-height: 100vh;
  padding: 38px;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 75% 20%,#ecedef 0,transparent 29%),#f9f9fa;
}
.login-brand {
  position: absolute;
  top: 28px;
  left: 38px;
}
.login-brand img {
  width: 145px;
  height: 70px;
  object-fit: contain;
}
.login-card {
  width: min(100%,430px);
  padding: 41px;
  border: 1px solid #e4e6e9;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 18px 45px rgba(33,37,42,.1);
}
.login-icon {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  margin-bottom: 27px;
  border-radius: 10px;
  background: #f1f2f3;
  color: #c2982d;
}
.login-card h1 {
  margin: 0;
  letter-spacing: -.05em;
  font-size: 39px;
}
.login-card>p:not(.eyebrow) {
  margin: 14px 0 27px;
  color: #6c7787;
  font-size: 15px;
  line-height: 1.6;
}
.login-card .button {
  width: 100%;
}
.login-card small {
  display: block;
  margin-top: 18px;
  text-align: center;
  color: #919aa6;
  font-size: 11px;
}
@media (max-width:900px) {
  .site-header {
    height: 84px;
  }
  .brand img {
    width: 128px;
    height: 62px;
  }
  .site-header nav,.header-actions {
    display: none;
  }
  .menu-button {
    display: block;
  }
  .hero {
    grid-template-columns: 1fr;
    padding-top: 62px;
    gap: 35px;
  }
  .hero-copy {
    padding-bottom: 0;
  }
  .product-stage {
    min-height: 440px;
  }
  .logo-row {
    gap: 22px;
    align-items: flex-start;
    flex-direction: column;
  }
  .logo-row div {
    width: 100%;
    flex-wrap: wrap;
    justify-content: flex-start;
  }
  .split-intro,.outcome-layout,.integrations-layout,.quote-panel,.testimonial-heading {
    grid-template-columns: 1fr;
    gap: 35px;
  }
  .testimonial-heading h2 {
    grid-row: auto;
  }
  .testimonial-heading .eyebrow {
    grid-column: auto;
  }
  .testimonial-heading p {
    max-width: 500px;
  }
  .testimonial-grid {
    grid-template-columns: 1fr;
  }
  .testimonial-grid figure {
    min-height: 0;
